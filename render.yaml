services:
  - type: web
    name: docsearch-api
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        sync: false   # paste your Neon/Supabase connection string in the Render dashboard
      - key: REDIS_URL
        sync: false   # paste your Upstash connection string in the Render dashboard
      - key: ENVIRONMENT
        value: production
    healthCheckPath: /health
