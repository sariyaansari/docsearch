<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document Search — Console</title>
<style>
  :root {
    --paper: #faf9f6;
    --ink: #1c1b19;
    --ink-soft: #6b6862;
    --line: #ddd9d1;
    --accent: #2f5d5a;
    --accent-soft: #e4ece9;
    --mark: #f2d88a;
    --danger: #a3402f;
    --mono: 'IBM Plex Mono', 'SF Mono', Consolas, monospace;
    --sans: 'IBM Plex Sans', -apple-system, Segoe UI, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.5;
  }
  header {
    padding: 28px 32px 20px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1 {
    font-family: var(--mono);
    font-size: 18px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
  }
  header h1 span { color: var(--accent); }
  .conn {
    display: flex;
    align-items: center;
    gap: 16px;
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--ink-soft);
  }
  .conn input {
    font-family: var(--mono);
    font-size: 12.5px;
    border: 1px solid var(--line);
    background: white;
    padding: 5px 9px;
    border-radius: 4px;
    width: 150px;
    color: var(--ink);
  }
  .conn label { display: flex; align-items: center; gap: 6px; }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #b8b3a8; flex-shrink: 0;
    transition: background 0.2s;
  }
  .dot.up { background: #4a8c6f; }
  .dot.down { background: var(--danger); }

  main {
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 0;
    min-height: calc(100vh - 77px);
  }
  @media (max-width: 800px) {
    main { grid-template-columns: 1fr; }
  }
  .panel {
    padding: 28px 32px;
  }
  .panel-left {
    border-right: 1px solid var(--line);
  }
  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 12px;
    text-transform: none;
    color: var(--ink-soft);
    margin-bottom: 5px;
  }
  .field input, .field textarea {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid var(--line);
    border-radius: 5px;
    font-family: var(--sans);
    font-size: 14px;
    background: white;
    color: var(--ink);
    resize: vertical;
  }
  .field textarea { min-height: 90px; }
  .field input:focus, .field textarea:focus {
    outline: none;
    border-color: var(--accent);
  }
  button {
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 500;
    padding: 9px 16px;
    border-radius: 5px;
    border: none;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  button:hover { opacity: 0.85; }
  button:active { opacity: 0.7; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: white; }
  .btn-ghost { background: transparent; color: var(--danger); padding: 4px 8px; font-size: 12.5px; border: 1px solid transparent; }
  .btn-ghost:hover { background: #fbeae6; }

  .section-label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-soft);
    margin: 0 0 14px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line);
  }

  .msg {
    font-size: 13px;
    padding: 9px 11px;
    border-radius: 5px;
    margin-top: 12px;
    display: none;
  }
  .msg.show { display: block; }
  .msg.ok { background: var(--accent-soft); color: var(--accent); }
  .msg.err { background: #fbeae6; color: var(--danger); }

  .search-row {
    display: flex;
    gap: 10px;
    margin-bottom: 6px;
  }
  .search-row input {
    flex: 1;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 15px;
    background: white;
  }
  .search-row input:focus { outline: none; border-color: var(--accent); }
  .search-meta {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 20px;
    min-height: 16px;
  }
  .search-meta b { color: var(--ink); }

  .result {
    border-bottom: 1px solid var(--line);
    padding: 18px 0;
  }
  .result:first-child { padding-top: 0; }
  .result-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 6px;
  }
  .result-title { font-size: 15.5px; font-weight: 600; }
  .result-score {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .result-snippet {
    font-size: 14px;
    color: #46443f;
    margin-bottom: 8px;
  }
  .result-snippet mark {
    background: var(--mark);
    color: inherit;
    padding: 0 2px;
    border-radius: 2px;
  }
  .result-foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-soft);
  }

  .empty {
    color: var(--ink-soft);
    font-size: 14px;
    padding: 40px 0;
    text-align: center;
  }
  code {
    font-family: var(--mono);
    background: var(--accent-soft);
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 0.9em;
  }
</style>
</head>
<body>

<header>
  <h1>document<span>search</span>/console</h1>
  <div class="conn">
    <label><span class="dot" id="health-dot"></span><span id="health-text">checking…</span></label>
    <label>API URL <input id="base-url" value="http://localhost:8000"></label>
    <label>Tenant <input id="tenant-id" value="tenant-acme"></label>
  </div>
</header>

<main>
  <div class="panel panel-left">
    <p class="section-label">index a document</p>
    <div class="field">
      <label for="doc-title">Title</label>
      <input id="doc-title" placeholder="Q3 Financial Report">
    </div>
    <div class="field">
      <label for="doc-content">Content</label>
      <textarea id="doc-content" placeholder="Revenue grew 12% quarter over quarter, driven by..."></textarea>
    </div>
    <div class="field">
      <label for="doc-category">Category (metadata, optional)</label>
      <input id="doc-category" placeholder="engineering">
    </div>
    <button class="btn-primary" id="index-btn" style="width:100%">Index document</button>
    <div class="msg" id="index-msg"></div>
  </div>

  <div class="panel">
    <p class="section-label">search</p>
    <div class="search-row">
      <input id="search-input" placeholder="Search this tenant's documents…" autofocus>
    </div>
    <div class="search-meta" id="search-meta"></div>
    <div id="results"></div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const baseUrl = () => $('base-url').value.replace(/\/$/, '');
const tenant = () => $('tenant-id').value.trim();

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function checkHealth() {
  const dot = $('health-dot'), text = $('health-text');
  try {
    const res = await fetch(`${baseUrl()}/health`);
    const data = await res.json();
    dot.className = 'dot ' + (data.status === 'healthy' ? 'up' : data.status === 'degraded' ? 'up' : 'down');
    text.textContent = `${data.status} · pg ${data.dependencies.postgres.status} · redis ${data.dependencies.redis.status}`;
  } catch (e) {
    dot.className = 'dot down';
    text.textContent = 'unreachable — check API URL / CORS';
  }
}

async function indexDocument() {
  const title = $('doc-title').value.trim();
  const content = $('doc-content').value.trim();
  const category = $('doc-category').value.trim();
  const msg = $('index-msg');
  msg.className = 'msg';

  if (!title || !content) {
    msg.textContent = 'Title and content are required.';
    msg.className = 'msg err show';
    return;
  }

  $('index-btn').disabled = true;
  try {
    const res = await fetch(`${baseUrl()}/documents`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Tenant-ID': tenant() },
      body: JSON.stringify({ title, content, metadata: category ? { category } : {} })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || data.error || 'Request failed');
    msg.textContent = `Indexed — id ${data.id.slice(0, 8)}…`;
    msg.className = 'msg ok show';
    $('doc-title').value = '';
    $('doc-content').value = '';
    $('doc-category').value = '';
    if ($('search-input').value.trim()) runSearch();
  } catch (e) {
    msg.textContent = e.message;
    msg.className = 'msg err show';
  } finally {
    $('index-btn').disabled = false;
  }
}

let searchDebounce;
function scheduleSearch() {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(runSearch, 300);
}

async function runSearch() {
  const q = $('search-input').value.trim();
  const results = $('results');
  const meta = $('search-meta');

  if (!q) { results.innerHTML = ''; meta.textContent = ''; return; }

  try {
    const res = await fetch(`${baseUrl()}/search?q=${encodeURIComponent(q)}&limit=20`, {
      headers: { 'X-Tenant-ID': tenant() }
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || data.error || 'Search failed');

    meta.innerHTML = `<b>${data.total_results}</b> result${data.total_results === 1 ? '' : 's'} for tenant <b>${escapeHtml(tenant())}</b> · ${data.took_ms}ms ${data.cached ? '· cached' : ''}`;

    if (data.results.length === 0) {
      results.innerHTML = '<div class="empty">No matches. Index a document on the left, or try a different term.</div>';
      return;
    }

    results.innerHTML = data.results.map(r => `
      <div class="result">
        <div class="result-head">
          <div class="result-title">${escapeHtml(r.title)}</div>
          <div class="result-score">score ${r.score.toFixed(3)}</div>
        </div>
        <div class="result-snippet">${r.snippet}</div>
        <div class="result-foot">
          <span>${r.id}</span>
          <button class="btn-ghost" onclick="deleteDoc('${r.id}')">Delete</button>
        </div>
      </div>
    `).join('');
  } catch (e) {
    meta.textContent = '';
    results.innerHTML = `<div class="empty">${escapeHtml(e.message)}</div>`;
  }
}

async function deleteDoc(id) {
  try {
    const res = await fetch(`${baseUrl()}/documents/${id}`, {
      method: 'DELETE',
      headers: { 'X-Tenant-ID': tenant() }
    });
    if (res.status !== 204) throw new Error('Delete failed');
    runSearch();
  } catch (e) {
    alert(e.message);
  }
}

$('index-btn').addEventListener('click', indexDocument);
$('search-input').addEventListener('input', scheduleSearch);
$('base-url').addEventListener('change', checkHealth);
$('tenant-id').addEventListener('change', () => { if ($('search-input').value.trim()) runSearch(); });

checkHealth();
setInterval(checkHealth, 15000);
</script>

</body>
</html>
