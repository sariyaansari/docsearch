<svg width="700" height="500" viewBox="0 0 700 500" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Prototype architecture</title>
<desc>Client sends requests through a load balancer to a horizontally scaled, stateless app tier, which reads and writes to Redis for caching and rate limiting, and to Postgres as the source of truth and full-text search index.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- Client -->
<g>
<rect x="270" y="40" width="160" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="350" y="62" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Client</text>
</g>

<line x1="350" y1="84" x2="350" y2="144" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Load balancer -->
<g>
<rect x="250" y="144" width="200" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="350" y="166" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Load balancer</text>
</g>

<line x1="350" y1="188" x2="350" y2="248" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- App tier container -->
<g>
<rect x="81" y="248" width="538" height="104" rx="20" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="101" y="270" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">App tier</text>
<text x="101" y="287" font-family="sans-serif" font-size="12" fill="#0F6E56">Stateless, horizontally scaled</text>
</g>
<rect x="101" y="296" width="150" height="44" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text x="176" y="318" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#085041">App instance</text>
<rect x="275" y="296" width="150" height="44" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text x="350" y="318" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#085041">App instance</text>
<rect x="449" y="296" width="150" height="44" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text x="524" y="318" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#085041">App instance</text>

<path d="M330 352 L250 400" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M370 352 L470 400" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Redis -->
<g>
<rect x="110" y="404" width="220" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="220" y="424" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">Redis</text>
<text x="220" y="442" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#993C1D">Cache + rate limiter</text>
</g>

<!-- Postgres -->
<g>
<rect x="370" y="404" width="220" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="480" y="424" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">Postgres</text>
<text x="480" y="442" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">Primary store + FTS index</text>
</g>

</svg>
