<svg width="700" height="520" viewBox="0 0 700 520" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Production-scale search pipeline extension</title>
<desc>At production scale, Postgres remains the source of truth but is no longer the search index. A change-data-capture process streams writes into Kafka, which indexing workers consume to keep a separate Elasticsearch or OpenSearch cluster in sync for search traffic.</desc>
<defs>
<marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- Postgres -->
<g>
<rect x="200" y="40" width="300" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="350" y="60" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">Postgres</text>
<text x="350" y="78" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">Source of truth (unchanged)</text>
</g>

<line x1="350" y1="96" x2="350" y2="136" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow2)"/>

<!-- CDC -->
<g>
<rect x="200" y="140" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="350" y="160" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Change data capture</text>
<text x="350" y="178" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">e.g. Debezium</text>
</g>

<line x1="350" y1="196" x2="350" y2="236" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow2)"/>

<!-- Kafka -->
<g>
<rect x="200" y="240" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="350" y="260" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Kafka</text>
<text x="350" y="278" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534AB7">Message queue, absorbs write bursts</text>
</g>

<line x1="350" y1="296" x2="350" y2="336" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow2)"/>

<!-- Indexing workers -->
<g>
<rect x="200" y="340" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="350" y="360" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">Indexing workers</text>
<text x="350" y="378" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">Consume queue, write to index</text>
</g>

<line x1="350" y1="396" x2="350" y2="436" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow2)"/>

<!-- Elasticsearch -->
<g>
<rect x="200" y="440" width="300" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="350" y="460" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">Elasticsearch / OpenSearch</text>
<text x="350" y="478" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#993C1D">Sharded search index, serves reads</text>
</g>

</svg>
